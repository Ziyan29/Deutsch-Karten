<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deutsch Karten — 德语单词卡片</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3350;
    --accent: #4f8ef7;
    --accent-dim: #2a4a8a;
    --green: #3ecf8e;
    --yellow: #f5a623;
    --red: #e5534b;
    --text: #e0e4f0;
    --text-dim: #7a82a0;
    --radius: 10px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }

  /* ── Layout ── */
  #app { display: flex; height: 100vh; }

  nav {
    width: 200px;
    min-width: 200px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px 0;
  }

  nav .logo {
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    padding: 0 20px 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
    letter-spacing: 0.5px;
  }

  nav button {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 14px;
    text-align: left;
    padding: 10px 20px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    border-radius: 0;
  }

  nav button:hover { background: var(--surface2); color: var(--text); }
  nav button.active { background: var(--surface2); color: var(--accent); font-weight: 600; }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 30px;
  }

  h1 { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
  h2 { font-size: 16px; font-weight: 600; margin-bottom: 14px; }

  /* ── Mobile layout ── */
  @media (max-width: 600px) {
    #app { flex-direction: column; }

    nav {
      width: 100%;
      min-width: unset;
      border-right: none;
      border-top: 1px solid var(--border);
      order: 2;
      flex-direction: row;
      padding: 0;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 50;
      background: var(--surface);
    }

    nav .logo { display: none; }
    nav .sync-area { display: none; }

    nav button {
      flex: 1;
      text-align: center;
      padding: 10px 4px 8px;
      font-size: 11px;
      border-radius: 0;
      border-top: 2px solid transparent;
    }

    nav button.active {
      border-top-color: var(--accent);
      background: none;
      color: var(--accent);
    }

    main {
      order: 1;
      padding: 16px 14px 80px;
      overflow-y: auto;
      flex: 1;
    }

    h1 { font-size: 17px; margin-bottom: 14px; }

    .card-area { max-width: 100%; }

    .flashcard {
      min-height: 200px;
      padding: 28px 20px;
    }

    .card-word { font-size: 28px; }
    .card-meaning { font-size: 18px; }

    .rating-row { gap: 7px; margin-top: 16px; }
    .rating-btn { padding: 10px 10px; font-size: 12px; flex: 1; }

    .word-table { font-size: 12px; }
    .word-table th, .word-table td { padding: 7px 6px; }
    .word-table th:nth-child(5),
    .word-table td:nth-child(5),
    .word-table th:nth-child(6),
    .word-table td:nth-child(6) { display: none; }

    .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .stat-card { padding: 14px; }
    .stat-card .value { font-size: 22px; }

    .modal { padding: 20px 16px; }

    input[type="text"], select, textarea { font-size: 16px; }
  }

  /* ── Stats Cards ── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 14px;
    margin-bottom: 30px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
  }

  .stat-card .value { font-size: 28px; font-weight: 700; color: var(--accent); }
  .stat-card .label { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

  /* ── Flash Card ── */
  .card-area { max-width: 520px; margin: 0 auto; }

  .progress-bar-wrap {
    background: var(--surface2);
    border-radius: 4px;
    height: 6px;
    margin-bottom: 20px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
    transition: width 0.3s;
  }

  .flashcard {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    min-height: 240px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    padding: 40px 30px;
    position: relative;
    transition: transform 0.15s;
  }

  .flashcard:hover { transform: translateY(-2px); }

  .card-hint {
    font-size: 11px;
    color: var(--text-dim);
    position: absolute;
    bottom: 14px;
    right: 18px;
  }

  .card-front-label {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .card-word {
    font-size: 36px;
    font-weight: 700;
    color: var(--text);
    text-align: center;
  }

  .card-article {
    font-size: 20px;
    font-weight: 400;
    margin-right: 8px;
  }
  .art-der { color: #5b9cf6; }
  .art-die { color: #f26d6d; }
  .art-das { color: #3ecf8e; }
  .art-pl  { color: var(--text-dim); }
  .article-sm { font-size: 12px; font-weight: 400; margin-right: 4px; }

  /* pos multi-select toggle buttons */
  .pos-toggles { display: flex; flex-wrap: wrap; gap: 6px; }
  .pos-toggle {
    padding: 4px 10px; font-size: 12px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface2); color: var(--text-dim);
    user-select: none; transition: background 0.12s, color 0.12s, border-color 0.12s;
  }
  .pos-toggle.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }

  .card-pos {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 6px;
  }

  .card-meaning {
    font-size: 22px;
    color: var(--green);
    text-align: center;
    margin-top: 12px;
  }

  .card-example {
    font-size: 13px;
    color: var(--text-dim);
    text-align: center;
    margin-top: 12px;
    font-style: italic;
    max-width: 380px;
    white-space: pre-wrap;
  }

  .rating-row {
    display: flex;
    gap: 10px;
    margin-top: 22px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .rating-btn {
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
    transition: opacity 0.15s;
  }

  .rating-btn:hover { opacity: 0.85; }
  .rating-btn.r1 { background: #5a1a18; color: #ff7b75; }
  .rating-btn.r2 { background: #5a3a10; color: #ffb75e; }
  .rating-btn.r3 { background: #3a4a10; color: #c8e050; }
  .rating-btn.r4 { background: #10403a; color: #5eebb8; }
  .rating-btn.r5 { background: #102a5a; color: #7ab8ff; }

  .no-cards {
    text-align: center;
    color: var(--text-dim);
    padding: 60px 20px;
  }

  .no-cards .big { font-size: 48px; margin-bottom: 14px; }
  .no-cards p { margin-bottom: 8px; }

  /* ── Word List ── */
  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
    flex-wrap: wrap;
    align-items: center;
  }

  input[type="text"], input[type="date"], select, textarea {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    padding: 7px 10px;
    outline: none;
  }

  input[type="text"]:focus, select:focus, textarea:focus {
    border-color: var(--accent);
  }

  .btn {
    border: none;
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 500;
    transition: opacity 0.15s;
  }

  .btn:hover { opacity: 0.85; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: #3a1210; color: var(--red); border: 1px solid #5a2220; }

  .word-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  .word-table th {
    text-align: left;
    color: var(--text-dim);
    font-weight: 600;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    letter-spacing: 0.5px;
  }

  .word-table td {
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }

  .word-table tr:hover td { background: var(--surface2); }

  .badge {
    display: inline-block;
    border-radius: 4px;
    padding: 2px 7px;
    font-size: 11px;
    font-weight: 600;
  }

  .badge-new { background: #1a2a5a; color: var(--accent); }
  .badge-learning { background: #3a3010; color: var(--yellow); }
  .badge-review { background: #0f3020; color: var(--green); }
  .badge-mature { background: #1a3a2a; color: #2ecc71; }

  .interval-text { color: var(--text-dim); font-size: 12px; }

  /* ── Add/Edit Modal ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
    width: 460px;
    max-width: 95vw;
    max-height: 90vh;
    overflow-y: auto;
  }

  .modal h2 { margin-bottom: 20px; }

  .form-row { margin-bottom: 14px; }
  .form-row label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 5px; }
  .form-row input, .form-row select, .form-row textarea { width: 100%; }
  .form-row textarea { height: 70px; resize: vertical; }

  .form-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

  /* ── Import ── */
  .import-area {
    background: var(--surface2);
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 18px;
  }

  .import-area p { color: var(--text-dim); font-size: 13px; line-height: 1.7; }

  .import-area code {
    background: var(--bg);
    border-radius: 4px;
    padding: 2px 6px;
    font-family: monospace;
    font-size: 12px;
    color: var(--accent);
  }

  .file-input-wrap { margin-top: 14px; }
  .file-input-wrap input[type="file"] { color: var(--text-dim); font-size: 13px; }

  /* ── Streak / calendar ── */
  .streak-bar {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    margin-top: 10px;
  }

  .streak-day {
    width: 18px;
    height: 18px;
    border-radius: 3px;
    background: var(--surface2);
    border: 1px solid var(--border);
  }

  .streak-day.done { background: var(--green); border-color: var(--green); }

  /* ── Toast ── */
  #toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 18px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
    z-index: 200;
  }

  #toast.show { opacity: 1; }

  .text-dim { color: var(--text-dim); }
  .mt-20 { margin-top: 20px; }
</style>
</head>
<body>

<div id="app">
  <nav>
    <div class="logo">Deutsch Karten</div>
    <button onclick="showView('review')" id="nav-review">今日复习</button>
    <button onclick="showView('words')" id="nav-words">单词本</button>
    <button onclick="showView('stats')" id="nav-stats">学习统计</button>
    <button onclick="showView('import')" id="nav-import">导入单词</button>
    <div class="sync-area" style="margin-top:auto;padding:16px 20px;font-size:11px">
      <span id="sync-indicator" style="color:var(--green)">云同步已启用</span>
    </div>
  </nav>
  <main id="view"></main>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2 id="modal-title">添加单词</h2>
    <div class="form-row">
      <label>德语单词 *</label>
      <input type="text" id="f-word" placeholder="z.B. lernen, das Buch">
    </div>
    <div class="form-row">
      <label>冠词（仅名词）</label>
      <select id="f-article">
        <option value="">无</option>
        <option value="der">der — 阳性</option>
        <option value="die">die — 阴性</option>
        <option value="das">das — 中性</option>
        <option value="die (Pl.)">die (Pl.) — 复数</option>
      </select>
    </div>
    <div class="form-row">
      <label>词性（可多选）</label>
      <div class="pos-toggles" id="f-pos-toggles">
        <span class="pos-toggle" data-val="n." onclick="togglePos(this)">名词 n.</span>
        <span class="pos-toggle" data-val="v." onclick="togglePos(this)">动词 v.</span>
        <span class="pos-toggle" data-val="adj." onclick="togglePos(this)">形容词 adj.</span>
        <span class="pos-toggle" data-val="adv." onclick="togglePos(this)">副词 adv.</span>
        <span class="pos-toggle" data-val="prep." onclick="togglePos(this)">介词 prep.</span>
        <span class="pos-toggle" data-val="konj." onclick="togglePos(this)">连词 konj.</span>
        <span class="pos-toggle" data-val="pron." onclick="togglePos(this)">代词 pron.</span>
        <span class="pos-toggle" data-val="art." onclick="togglePos(this)">冠词 art.</span>
        <span class="pos-toggle" data-val="num." onclick="togglePos(this)">数词 num.</span>
        <span class="pos-toggle" data-val="interj." onclick="togglePos(this)">感叹词 interj.</span>
      </div>
    </div>
    <div class="form-row">
      <label>中文释义 *</label>
      <input type="text" id="f-meaning" placeholder="学习；book 书">
    </div>
    <div class="form-row">
      <label>例句（可选）</label>
      <textarea id="f-example" placeholder="Ich lerne jeden Tag Deutsch."></textarea>
    </div>
    <div class="form-row">
      <label>标签（可选，逗号分隔）</label>
      <input type="text" id="f-tags" placeholder="A1, 动词, 日常">
    </div>
    <div class="form-footer">
      <button class="btn btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveWord()">保存</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── Storage ──────────────────────────────────────────────────────────────────
const STORE_STREAKS = 'dk_streaks';
const IDB_NAME      = 'DeutschKarten';
const IDB_VERSION   = 1;
const IDB_STORE     = 'words';

let _wordsCache = null;
let _db = null;

// Open (or create) the IndexedDB database; resolves once ready
const dbReady = new Promise((resolve, reject) => {
  const req = indexedDB.open(IDB_NAME, IDB_VERSION);
  req.onupgradeneeded = e => {
    const db = e.target.result;
    if (!db.objectStoreNames.contains(IDB_STORE)) {
      db.createObjectStore(IDB_STORE, { keyPath: 'id' });
    }
  };
  req.onsuccess = e => { _db = e.target.result; resolve(_db); };
  req.onerror   = e => reject(e.target.error);
});

// Load all words from IndexedDB into cache, then merge from Gist
async function initWords() {
  await dbReady;
  // Load local IndexedDB
  let localRows = await new Promise((resolve, reject) => {
    const tx = _db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).getAll();
    req.onsuccess = e => resolve(e.target.result || []);
    req.onerror   = e => reject(e.target.error);
  });

  // One-time migration from old localStorage
  try {
    const legacy = JSON.parse(localStorage.getItem('dk_words'));
    if (Array.isArray(legacy) && legacy.length > 0) {
      const existingIds = new Set(localRows.map(r => r.id));
      const migrants = legacy.filter(w => !existingIds.has(w.id));
      if (migrants.length > 0) {
        const mtx = _db.transaction(IDB_STORE, 'readwrite');
        const store = mtx.objectStore(IDB_STORE);
        migrants.forEach(w => store.put(w));
        await new Promise(r => { mtx.oncomplete = r; mtx.onerror = r; });
        localRows = localRows.concat(migrants);
      }
      localStorage.removeItem('dk_words');
    }
  } catch {}

  // Pull from Supabase and merge (remote wins on progress, local wins on new words)
  const remote = await Promise.race([
    sbFetchAllWords(),
    new Promise(r => setTimeout(() => r(null), 10000))
  ]);
  if (remote && Array.isArray(remote) && remote.length > 0) {
    const localMap = new Map(localRows.map(w => [w.id, w]));
    const remoteMap = new Map(remote.map(w => [w.id, w]));
    for (const [id, rw] of remoteMap) {
      const lw = localMap.get(id);
      if (!lw || (rw.repetitions || 0) >= (lw.repetitions || 0)) {
        localMap.set(id, rw);
      }
    }
    for (const [id, lw] of localMap) {
      if (!remoteMap.has(id)) localMap.set(id, lw);
    }
    localRows = Array.from(localMap.values());
    const mtx = _db.transaction(IDB_STORE, 'readwrite');
    const store = mtx.objectStore(IDB_STORE);
    store.clear();
    localRows.forEach(w => store.put(w));
    await new Promise(r => { mtx.oncomplete = r; mtx.onerror = r; });
    // Merge streaks
    const remoteStreaks = await sbPullStreaks();
    if (Array.isArray(remoteStreaks)) {
      const merged = [...new Set([...loadStreaks(), ...remoteStreaks])];
      saveStreaks(merged);
    }
  }

  _wordsCache = localRows;
  return localRows;
}

// Synchronous read from in-memory cache (safe after initWords resolves)
function loadWords() {
  return _wordsCache || [];
}

// Write full array to cache + persist async to IndexedDB (used for bulk ops)
function saveWords(w) {
  _wordsCache = w;
  dbReady.then(() => {
    const tx = _db.transaction(IDB_STORE, 'readwrite');
    const store = tx.objectStore(IDB_STORE);
    store.clear();
    w.forEach(word => store.put(word));
  });
  schedulePush();
}

// Persist a single updated word (efficient for review ratings)
function persistWord(word) {
  dbReady.then(() => {
    const tx = _db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(word);
  });
  schedulePush(word);
}

// Remove a single word by id
function removeWordFromDB(id) {
  dbReady.then(() => {
    const tx = _db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(id);
  });
  sbDeleteWord(id);
}

// Remove multiple words by id array
function removeWordsFromDB(ids) {
  dbReady.then(() => {
    const tx = _db.transaction(IDB_STORE, 'readwrite');
    const store = tx.objectStore(IDB_STORE);
    ids.forEach(id => store.delete(id));
  });
  sbDeleteWords(ids);
}

// ── Supabase Sync ─────────────────────────────────────────────────────────────
const SB_URL = 'https://ernairanmichfjlbcrtd.supabase.co';
const SB_KEY = 'sb_publishable_ZuPl2frZz3N1AssqfSuHGA_VeuEf9R2';
let _syncTimer  = null;
let _syncStatus = 'idle';

function sbHeaders() {
  return {
    'apikey': SB_KEY,
    'Authorization': `Bearer ${SB_KEY}`,
    'Content-Type': 'application/json',
    'Prefer': 'resolution=merge-duplicates'
  };
}

function wordToRow(w) {
  return {
    id:            w.id,
    word:          w.word,
    article:       w.article || '',
    pos:           w.pos || '',
    meaning:       w.meaning,
    example:       w.example || '',
    tags:          w.tags || [],
    interval:      w.interval || 0,
    repetitions:   w.repetitions || 0,
    ease_factor:   w.easeFactor || 2.5,
    due_date:      w.dueDate || null,
    last_reviewed: w.lastReviewed || null
  };
}

function rowToWord(r) {
  return {
    id:           r.id,
    word:         r.word,
    article:      r.article || '',
    pos:          r.pos || '',
    meaning:      r.meaning,
    example:      r.example || '',
    tags:         r.tags || [],
    interval:     r.interval || 0,
    repetitions:  r.repetitions || 0,
    easeFactor:   r.ease_factor || 2.5,
    dueDate:      r.due_date || null,
    lastReviewed: r.last_reviewed || null
  };
}

async function sbFetchAllWords() {
  const allRows = [];
  const pageSize = 1000;
  let offset = 0;
  while (true) {
    const res = await fetch(
      `${SB_URL}/rest/v1/words?select=*&order=id&limit=${pageSize}&offset=${offset}`,
      { headers: sbHeaders() }
    );
    if (!res.ok) return null;
    const rows = await res.json();
    allRows.push(...rows);
    if (rows.length < pageSize) break;
    offset += pageSize;
  }
  return allRows.map(rowToWord);
}

async function sbUpsertWord(w) {
  await fetch(`${SB_URL}/rest/v1/words`, {
    method: 'POST',
    headers: sbHeaders(),
    body: JSON.stringify(wordToRow(w))
  });
}

async function sbUpsertWords(ws) {
  const batchSize = 500;
  for (let i = 0; i < ws.length; i += batchSize) {
    const batch = ws.slice(i, i + batchSize).map(wordToRow);
    const res = await fetch(`${SB_URL}/rest/v1/words`, {
      method: 'POST',
      headers: sbHeaders(),
      body: JSON.stringify(batch)
    });
    if (!res.ok) return false;
  }
  return true;
}

async function sbDeleteWord(id) {
  await fetch(`${SB_URL}/rest/v1/words?id=eq.${encodeURIComponent(id)}`, {
    method: 'DELETE', headers: sbHeaders()
  });
}

async function sbDeleteWords(ids) {
  const inList = ids.map(id => `"${id}"`).join(',');
  await fetch(`${SB_URL}/rest/v1/words?id=in.(${inList})`, {
    method: 'DELETE', headers: sbHeaders()
  });
}

async function sbPullStreaks() {
  const res = await fetch(`${SB_URL}/rest/v1/streaks?id=eq.1`, { headers: sbHeaders() });
  if (!res.ok) return null;
  const rows = await res.json();
  return rows[0]?.dates || null;
}

async function sbPushStreaks(dates) {
  await fetch(`${SB_URL}/rest/v1/streaks`, {
    method: 'POST',
    headers: sbHeaders(),
    body: JSON.stringify({ id: 1, dates })
  });
}

function schedulePush(word) {
  if (word) {
    sbUpsertWord(word).then(() => { _syncStatus = 'ok'; updateSyncIndicator(); setTimeout(() => { _syncStatus = 'idle'; updateSyncIndicator(); }, 2000); });
  } else {
    clearTimeout(_syncTimer);
    _syncTimer = setTimeout(async () => {
      _syncStatus = 'syncing'; updateSyncIndicator();
      const ok = await sbUpsertWords(loadWords());
      _syncStatus = ok ? 'ok' : 'error'; updateSyncIndicator();
      setTimeout(() => { _syncStatus = 'idle'; updateSyncIndicator(); }, 2000);
    }, 1500);
  }
}

function updateSyncIndicator() {
  const el = document.getElementById('sync-indicator');
  if (!el) return;
  const map = { idle: '云同步已启用', syncing: '同步中…', ok: '已同步', error: '同步失败' };
  const col = { idle: 'var(--green)', syncing: 'var(--yellow)', ok: 'var(--green)', error: 'var(--red)' };
  el.textContent = map[_syncStatus];
  el.style.color  = col[_syncStatus];
}



function loadStreaks() {
  try { return JSON.parse(localStorage.getItem(STORE_STREAKS)) || []; }
  catch { return []; }
}

function saveStreaks(s) {
  localStorage.setItem(STORE_STREAKS, JSON.stringify(s));
}

function markTodayActive() {
  const today = todayStr();
  const streaks = loadStreaks();
  if (!streaks.includes(today)) {
    streaks.push(today);
    saveStreaks(streaks);
    sbPushStreaks(streaks);
  }
}

// ── SM-2 Algorithm ───────────────────────────────────────────────────────────
// quality: 1=Again 2=Hard 3=Good 4=Easy 5=Perfect
function sm2(card, quality) {
  let { interval, repetitions, easeFactor } = card;

  if (quality < 3) {
    repetitions = 0;
    interval = 1;
  } else {
    if (repetitions === 0) interval = 1;
    else if (repetitions === 1) interval = 6;
    else interval = Math.round(interval * easeFactor);
    repetitions += 1;
  }

  easeFactor = easeFactor + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
  if (easeFactor < 1.3) easeFactor = 1.3;

  const dueDate = new Date();
  dueDate.setDate(dueDate.getDate() + interval);

  return {
    interval,
    repetitions,
    easeFactor: parseFloat(easeFactor.toFixed(2)),
    dueDate: dueDate.toISOString().slice(0, 10),
    lastReviewed: todayStr()
  };
}

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function isDue(card) {
  return !card.dueDate || card.dueDate <= todayStr();
}

function cardStage(card) {
  if (card.repetitions === 0 && !card.lastReviewed) return 'new';
  if (card.repetitions <= 1) return 'learning';
  if (card.interval < 21) return 'review';
  return 'mature';
}

// ── Review View ───────────────────────────────────────────────────────────────
function buildReviewQueue() {
  words = loadWords();
  let due = words.filter(isDue);
  // New cards first, then by due date
  due.sort((a, b) => {
    if (!a.lastReviewed && b.lastReviewed) return -1;
    if (a.lastReviewed && !b.lastReviewed) return 1;
    return (a.dueDate || '').localeCompare(b.dueDate || '');
  });
  // Apply daily limit (0 = unlimited)
  reviewQueue = dailyLimit > 0 ? due.slice(0, dailyLimit) : due;
  reviewIndex = 0;
  reviewFlipped = false;
  sessionDone = 0;
}

function renderReview(container) {
  words = loadWords();
  const allDue = words.filter(isDue);

  const limitOptions = [10, 20, 30, 50, 100, 0].map(n =>
    `<option value="${n}" ${dailyLimit === n ? 'selected' : ''}>${n === 0 ? '不限' : n + ' 词'}</option>`
  ).join('');

  const limitBar = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap">
      <span style="font-size:13px;color:var(--text-dim)">每日学习量</span>
      <select onchange="setDailyLimit(this.value)" style="font-size:13px;padding:5px 10px">${limitOptions}</select>
      <span style="font-size:12px;color:var(--text-dim)">今日待复习共 <strong style="color:var(--text)">${allDue.length}</strong> 词</span>
    </div>`;

  if (allDue.length === 0) {
    container.innerHTML = `
      <h1>今日复习</h1>
      ${limitBar}
      <div class="card-area">
        <div class="no-cards">
          <div class="big">✓</div>
          <p style="font-size:18px;color:var(--text)">今日任务完成！</p>
          <p>共 ${words.length} 个单词，下次复习请明天再来。</p>
          <p class="text-dim" style="margin-top:20px">想继续练习？前往「单词本」查看所有单词。</p>
        </div>
      </div>`;
    return;
  }

  if (reviewQueue.length === 0 || reviewIndex >= reviewQueue.length) {
    buildReviewQueue();
  }

  // Inject limit bar before card area
  renderCard(container, limitBar);
}

function renderCard(container, prefix) {
  if (reviewIndex >= reviewQueue.length) {
    buildReviewQueue();
    if (reviewQueue.length === 0) { renderReview(container); return; }
  }

  const total = reviewQueue.length + sessionDone;
  const pct = sessionDone / total * 100;
  const card = reviewQueue[reviewIndex];

  const front = `
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" style="width:${pct}%"></div>
    </div>
    <p class="text-dim" style="margin-bottom:14px;font-size:12px">
      今日剩余 ${reviewQueue.length - reviewIndex} / ${total} 张
    </p>
    <div class="flashcard" id="flashcard" onclick="flipCard()">
      <div class="card-front-label">德语 → 释义 &nbsp;·&nbsp; 点击翻转</div>
      <div class="card-word">
        ${articleHtml(card.article)}${card.word}
      </div>
      ${card.pos ? `<div class="card-pos">${card.pos}</div>` : ''}
      <div class="card-hint">按空格翻转</div>
    </div>
    <div class="rating-row" id="rating-row" style="display:none">
      <button class="rating-btn r1" onclick="rate(1)">1 忘了</button>
      <button class="rating-btn r2" onclick="rate(2)">2 很难</button>
      <button class="rating-btn r3" onclick="rate(3)">3 还行</button>
      <button class="rating-btn r4" onclick="rate(4)">4 容易</button>
      <button class="rating-btn r5" onclick="rate(5)">5 很熟</button>
    </div>`;

  container.innerHTML = `<h1>今日复习</h1>${prefix || ''}<div class="card-area">${front}</div>`;
}

function flipCard() {
  const card = reviewQueue[reviewIndex];
  const fc = document.getElementById('flashcard');

  if (!reviewFlipped) {
    reviewFlipped = true;
    const exHtml = card.example ? `<div class="card-example">${card.example}</div>` : '';
    fc.innerHTML = `
      <div class="card-front-label">释义 &nbsp;·&nbsp; 点击看德语</div>
      <div class="card-meaning">${card.meaning}</div>
      ${exHtml}
      <div class="card-hint">再次点击翻回 | 选择评分</div>`;
    document.getElementById('rating-row').style.display = 'flex';
  } else {
    reviewFlipped = false;
    fc.innerHTML = `
      <div class="card-front-label">德语 → 释义 &nbsp;·&nbsp; 点击翻转</div>
      <div class="card-word">
        ${articleHtml(card.article)}${card.word}
      </div>
      ${card.pos ? `<div class="card-pos">${card.pos}</div>` : ''}
      <div class="card-hint">按空格翻转</div>`;
    document.getElementById('rating-row').style.display = 'none';
  }
}

function rate(quality) {
  words = loadWords();
  const card = reviewQueue[reviewIndex];
  const idx = words.findIndex(w => w.id === card.id);
  if (idx !== -1) {
    const updated = sm2(words[idx], quality);
    Object.assign(words[idx], updated);
    persistWord(words[idx]);
  }

  markTodayActive();
  sessionDone++;
  reviewIndex++;
  reviewFlipped = false;

  const container = document.getElementById('view');
  renderCard(container);
}

// Keyboard shortcut
document.addEventListener('keydown', e => {
  const view = document.querySelector('#nav-review.active');
  if (!view) return;
  if (e.code === 'Space' && !reviewFlipped) { e.preventDefault(); flipCard(); }
  if (reviewFlipped) {
    if (e.key === '1') rate(1);
    else if (e.key === '2') rate(2);
    else if (e.key === '3') rate(3);
    else if (e.key === '4') rate(4);
    else if (e.key === '5') rate(5);
  }
});

// ── Words View ────────────────────────────────────────────────────────────────
let wordsLevelFilter = 'all';
let wordsSortKey    = 'word';
let wordsSortDir    = 'asc';
let wordsPosFilter  = 'all';
let wordsStageFilter = 'all';
let selectedIds     = new Set();
let _restoreSearchFocus = false;
let wordsPage       = 0;
const PAGE_SIZE     = 100;

function renderWords(container) {
  words = loadWords();
  const q = searchQuery.toLowerCase();
  const allLevels = ['A1','A2','B1','B2','C1','C2'];
  const presentLevels = allLevels.filter(l => words.some(w => (w.tags||[]).includes(l)));

  // Filter
  let filtered = words.slice();
  if (q) filtered = filtered.filter(w =>
    w.word.toLowerCase().includes(q) ||
    w.meaning.toLowerCase().includes(q) ||
    (w.tags||[]).join(',').toLowerCase().includes(q));
  if (wordsLevelFilter !== 'all')
    filtered = filtered.filter(w => (w.tags||[]).includes(wordsLevelFilter));
  if (wordsPosFilter !== 'all')
    filtered = filtered.filter(w => w.pos === wordsPosFilter);
  if (wordsStageFilter !== 'all')
    filtered = filtered.filter(w => cardStage(w) === wordsStageFilter);

  // Sort
  const stageOrder = { new:0, learning:1, review:2, mature:3 };
  filtered.sort((a, b) => {
    let va, vb;
    if (wordsSortKey === 'word') { va = a.word.toLowerCase(); vb = b.word.toLowerCase(); }
    else if (wordsSortKey === 'stage') { va = stageOrder[cardStage(a)]||0; vb = stageOrder[cardStage(b)]||0; }
    else if (wordsSortKey === 'interval') { va = a.interval||0; vb = b.interval||0; }
    else if (wordsSortKey === 'due') { va = a.dueDate||'9999'; vb = b.dueDate||'9999'; }
    if (va < vb) return wordsSortDir === 'asc' ? -1 : 1;
    if (va > vb) return wordsSortDir === 'asc' ? 1 : -1;
    return 0;
  });

  // Clamp page
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  if (wordsPage >= totalPages) wordsPage = totalPages - 1;
  const pageStart = wordsPage * PAGE_SIZE;
  const pageSlice = filtered.slice(pageStart, pageStart + PAGE_SIZE);

  // Clean up selectedIds to only valid filtered ids
  const filteredIds = new Set(filtered.map(w => w.id));
  selectedIds = new Set([...selectedIds].filter(id => filteredIds.has(id)));
  const pageIds = new Set(pageSlice.map(w => w.id));
  const allPageSelected = pageSlice.length > 0 && pageSlice.every(w => selectedIds.has(w.id));

  // Unique POS values
  const posOptions = [...new Set(words.map(w => w.pos).filter(Boolean))].sort();

  const levelBtns = ['all', ...presentLevels].map(l => `
    <button class="btn ${wordsLevelFilter===l?'btn-primary':'btn-secondary'}"
      style="padding:4px 10px;font-size:12px" onclick="setLevelFilter('${l}')">${l==='all'?'全部':l}</button>`
  ).join('');

  const stageBtns = [
    ['all','全部'], ['new','新词'], ['learning','学习中'], ['review','复习'], ['mature','已掌握']
  ].map(([v,l]) => `
    <button class="btn ${wordsStageFilter===v?'btn-primary':'btn-secondary'}"
      style="padding:4px 10px;font-size:12px" onclick="setStageFilter('${v}')">${l}</button>`
  ).join('');

  function sortTh(label, key) {
    const active = wordsSortKey === key;
    const arrow = active ? (wordsSortDir === 'asc' ? ' ↑' : ' ↓') : '';
    return `<th style="cursor:pointer;user-select:none" onclick="setSort('${key}')">${label}${arrow}</th>`;
  }

  const bulkBar = selectedIds.size > 0 ? `
    <div style="display:flex;align-items:center;gap:12px;background:var(--surface2);border:1px solid var(--border);
      border-radius:8px;padding:10px 14px;margin-bottom:12px">
      <span style="font-size:13px;color:var(--text)">已选 <strong>${selectedIds.size}</strong> 个</span>
      <button class="btn btn-danger" style="padding:5px 14px;font-size:13px" onclick="bulkDelete()">批量删除</button>
      <button class="btn btn-secondary" style="padding:5px 14px;font-size:13px" onclick="clearSelection()">取消选择</button>
    </div>` : '';

  // Pagination bar
  const paginationBar = totalPages > 1 ? `
    <div style="display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap">
      <button class="btn btn-secondary" style="padding:4px 10px;font-size:12px" onclick="setWordsPage(0)" ${wordsPage===0?'disabled':''}>«</button>
      <button class="btn btn-secondary" style="padding:4px 10px;font-size:12px" onclick="setWordsPage(${wordsPage-1})" ${wordsPage===0?'disabled':''}>‹</button>
      <span style="font-size:12px;color:var(--text-dim)">第 ${wordsPage+1} / ${totalPages} 页（${pageStart+1}–${Math.min(pageStart+PAGE_SIZE,filtered.length)} / ${filtered.length}）</span>
      <button class="btn btn-secondary" style="padding:4px 10px;font-size:12px" onclick="setWordsPage(${wordsPage+1})" ${wordsPage>=totalPages-1?'disabled':''}>›</button>
      <button class="btn btn-secondary" style="padding:4px 10px;font-size:12px" onclick="setWordsPage(${totalPages-1})" ${wordsPage>=totalPages-1?'disabled':''}>»</button>
    </div>` : '';

  const tableRows = pageSlice.map(w => wordRow(w, selectedIds.has(w.id))).join('');

  container.innerHTML = `
    <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px">
      <h1>单词本 <span style="font-size:14px;color:var(--text-dim);font-weight:400">(${filtered.length} / ${words.length})</span></h1>
      <button class="btn btn-primary" onclick="openAdd()">+ 添加单词</button>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <input type="text" id="search-input" placeholder="搜索单词或释义…"
          value="${escHtml(searchQuery)}" oninput="onSearch(this.value)" style="width:200px">
        <select onchange="setPosFilter(this.value)" style="font-size:12px;padding:5px 8px">
          <option value="all" ${wordsPosFilter==='all'?'selected':''}>所有词性</option>
          ${posOptions.map(p=>`<option value="${p}" ${wordsPosFilter===p?'selected':''}>${p}</option>`).join('')}
        </select>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        <span style="font-size:11px;color:var(--text-dim);min-width:28px">等级</span>${levelBtns}
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        <span style="font-size:11px;color:var(--text-dim);min-width:28px">状态</span>${stageBtns}
      </div>
    </div>

    ${bulkBar}

    <table class="word-table" id="words-table">
      <thead><tr>
        <th style="width:32px"><input type="checkbox" ${allPageSelected?'checked':''} onchange="toggleSelectAll(this.checked)" title="全选当页"></th>
        ${sortTh('德语单词','word')}
        <th>中文释义</th>
        ${sortTh('状态','stage')}
        ${sortTh('间隔','interval')}
        ${sortTh('下次复习','due')}
        <th>操作</th>
      </tr></thead>
      <tbody>${tableRows || '<tr><td colspan="7" style="text-align:center;color:var(--text-dim);padding:30px">没有符合条件的单词</td></tr>'}</tbody>
    </table>
    ${paginationBar}`;

  if (_restoreSearchFocus) {
    _restoreSearchFocus = false;
    const input = document.getElementById('search-input');
    if (input) { const len = input.value.length; input.focus(); input.setSelectionRange(len, len); }
  }
}

function wordRow(w, selected) {
  const stage = cardStage(w);
  const stageBadge = {
    new:      '<span class="badge badge-new">新词</span>',
    learning: '<span class="badge badge-learning">学习中</span>',
    review:   '<span class="badge badge-review">复习</span>',
    mature:   '<span class="badge badge-mature">已掌握</span>'
  }[stage];
  const interval = w.interval ? `${w.interval}天` : '—';
  const due = w.dueDate || '今天';
  const rowStyle = selected ? 'background:var(--accent-dim)' : '';
  return `<tr style="${rowStyle}">
    <td><input type="checkbox" ${selected?'checked':''} onchange="toggleSelect('${w.id}',this.checked)"></td>
    <td><strong>${articleHtml(w.article, 'article-sm')}${escHtml(w.word)}</strong>
      ${w.pos?`<span style="color:var(--text-dim);font-size:11px"> ${w.pos}</span>`:''}</td>
    <td style="max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escHtml(w.meaning)}">${escHtml(w.meaning)}</td>
    <td>${stageBadge}</td>
    <td class="interval-text">${interval}</td>
    <td class="interval-text">${due}</td>
    <td style="white-space:nowrap">
      <button class="btn btn-secondary" style="padding:3px 9px;font-size:12px" onclick="openEdit('${w.id}')">编辑</button>
      <button class="btn btn-danger" style="padding:3px 9px;font-size:12px;margin-left:4px" onclick="deleteWord('${w.id}')">删除</button>
    </td>
  </tr>`;
}

function setStageFilter(s)  { wordsStageFilter  = s; wordsPage = 0; selectedIds.clear(); renderWords(document.getElementById('view')); }

function onSearch(q)        { searchQuery = q; wordsPage = 0; _restoreSearchFocus = true; selectedIds.clear(); renderWords(document.getElementById('view')); }
function setWordsPage(p)    { wordsPage = p; renderWords(document.getElementById('view')); }

function setSort(key) {
  if (wordsSortKey === key) wordsSortDir = wordsSortDir === 'asc' ? 'desc' : 'asc';
  else { wordsSortKey = key; wordsSortDir = 'asc'; }

// ── Selection ─────────────────────────────────────────────────────────────────
function toggleSelect(id, checked) {
  if (checked) selectedIds.add(id); else selectedIds.delete(id);
  renderWords(document.getElementById('view'));
}

function toggleSelectAll(checked) {
  words = loadWords();
  const q = searchQuery.toLowerCase();
  let filtered = words.slice();
  if (q) filtered = filtered.filter(w =>
    w.word.toLowerCase().includes(q) || w.meaning.toLowerCase().includes(q));
  if (wordsLevelFilter !== 'all') filtered = filtered.filter(w => (w.tags||[]).includes(wordsLevelFilter));
  if (wordsPosFilter !== 'all')   filtered = filtered.filter(w => w.pos === wordsPosFilter);
  if (wordsStageFilter !== 'all') filtered = filtered.filter(w => cardStage(w) === wordsStageFilter);
  const pageSlice = filtered.slice(wordsPage * PAGE_SIZE, (wordsPage + 1) * PAGE_SIZE);

function bulkDelete() {
  if (selectedIds.size === 0) return;
  if (!confirm(`确定删除选中的 ${selectedIds.size} 个单词？此操作不可撤销。`)) return;
  const count = selectedIds.size;
  const idsToDelete = [...selectedIds];
  words = loadWords().filter(w => !selectedIds.has(w.id));
  _wordsCache = words;
  removeWordsFromDB(idsToDelete);
  selectedIds.clear();
  toast(`已删除 ${count} 个单词`);
  renderWords(document.getElementById('view'));
}


// ── Stats View ────────────────────────────────────────────────────────────────
let statsViewLevel = 'all';
let statsViewStage = 'all';

function renderStats(container) {
  words = loadWords();
  const streaks = loadStreaks().sort();
  const due = words.filter(isDue).length;
  const total = words.length;
  const mature = words.filter(w => cardStage(w) === 'mature').length;
  const newCount = words.filter(w => cardStage(w) === 'new').length;

  // streak
  let streak = 0;
  let d = new Date();
  while (true) {
    const s = d.toISOString().slice(0, 10);
    if (streaks.includes(s)) { streak++; d.setDate(d.getDate() - 1); }
    else break;
  }

  // last 30 days calendar
  const days30 = [];
  for (let i = 29; i >= 0; i--) {
    const dd = new Date(); dd.setDate(dd.getDate() - i);
    days30.push({ str: dd.toISOString().slice(0, 10) });
  }
  const calHtml = days30.map(d =>
    `<div class="streak-day ${streaks.includes(d.str) ? 'done' : ''}" title="${d.str}"></div>`
  ).join('');

  // Level breakdown table
  const allLevels = ['A1','A2','B1','B2','C1','C2'];
  const presentLevels = allLevels.filter(l => words.some(w => (w.tags||[]).includes(l)));
  const stages = [['new','新词','badge-new'],['learning','学习中','badge-learning'],['review','复习','badge-review'],['mature','已掌握','badge-mature']];

  const levelRows = [...presentLevels, '无级别'].map(lv => {
    const ws = lv === '无级别'
      ? words.filter(w => !allLevels.some(l => (w.tags||[]).includes(l)))
      : words.filter(w => (w.tags||[]).includes(lv));
    if (ws.length === 0) return '';
    const cells = stages.map(([s]) => {
      const cnt = ws.filter(w => cardStage(w) === s).length;
      return `<td style="text-align:center;cursor:pointer;color:${cnt>0?'var(--text)':'var(--text-dim)'}"
        onclick="statsShowWords('${lv}','${s}')" title="点击查看">${cnt}</td>`;
    }).join('');
    return `<tr>
      <td style="cursor:pointer;font-weight:600;color:var(--accent)" onclick="statsShowWords('${lv}','all')">${lv}</td>
      ${cells}
      <td style="text-align:center;cursor:pointer;font-weight:600" onclick="statsShowWords('${lv}','all')" title="点击查看全部">${ws.length}</td>
    </tr>`;
  }).join('');

  // Word list panel (filtered)
  const panelHtml = statsWordPanel();

  container.innerHTML = `
    <h1>学习统计</h1>
    <div class="stats-grid">
      <div class="stat-card"><div class="value">${total}</div><div class="label">总单词数</div></div>
      <div class="stat-card"><div class="value">${due}</div><div class="label">今日待复习</div></div>
      <div class="stat-card"><div class="value">${mature}</div><div class="label">已掌握</div></div>
      <div class="stat-card"><div class="value">${newCount}</div><div class="label">新词</div></div>
      <div class="stat-card"><div class="value">${streak}</div><div class="label">连续学习天数</div></div>
    </div>

    <h2>最近 30 天活跃记录</h2>
    <div class="streak-bar">${calHtml}</div>
    <p class="text-dim mt-20" style="font-size:12px">绿色 = 当天有复习记录</p>

    <h2 style="margin-top:28px">按级别查看单词</h2>
    <p style="font-size:12px;color:var(--text-dim);margin-bottom:12px">点击数字或级别名称可展开单词列表</p>
    <table class="word-table" style="max-width:600px">
      <thead><tr>
        <th>级别</th>
        <th style="text-align:center">新词</th>
        <th style="text-align:center">学习中</th>
        <th style="text-align:center">复习</th>
        <th style="text-align:center">已掌握</th>
        <th style="text-align:center">合计</th>
      </tr></thead>
      <tbody>${levelRows || '<tr><td colspan="6" style="color:var(--text-dim);padding:20px;text-align:center">暂无单词</td></tr>'}</tbody>
    </table>

    <div id="stats-word-panel" style="margin-top:20px">${panelHtml}</div>`;
}

function statsShowWords(level, stage) {
  statsViewLevel = level;
  statsViewStage = stage;
  document.getElementById('stats-word-panel').innerHTML = statsWordPanel();
}

function statsWordPanel() {
  if (statsViewLevel === 'all' && statsViewStage === 'all') return '';
  words = loadWords();
  const allLevels = ['A1','A2','B1','B2','C1','C2'];

  let filtered = words.slice();
  if (statsViewLevel !== 'all') {
    if (statsViewLevel === '无级别')
      filtered = filtered.filter(w => !allLevels.some(l => (w.tags||[]).includes(l)));
    else
      filtered = filtered.filter(w => (w.tags||[]).includes(statsViewLevel));
  }
  if (statsViewStage !== 'all') filtered = filtered.filter(w => cardStage(w) === statsViewStage);
  filtered.sort((a, b) => a.word.localeCompare(b.word));

  const stageLabel = { all:'全部', new:'新词', learning:'学习中', review:'复习', mature:'已掌握' };
  const title = `${statsViewLevel} · ${stageLabel[statsViewStage] || statsViewStage}（${filtered.length} 词）`;

  const rows = filtered.map(w => {
    const stage = cardStage(w);
    const stageBadge = {
      new:      '<span class="badge badge-new">新词</span>',
      learning: '<span class="badge badge-learning">学习中</span>',
      review:   '<span class="badge badge-review">复习</span>',
      mature:   '<span class="badge badge-mature">已掌握</span>'
    }[stage];
    return `<tr>
      <td><strong>${w.article ? `<span style="color:var(--yellow)">${w.article}</span> ` : ''}${escHtml(w.word)}</strong>
        ${w.pos ? `<span style="color:var(--text-dim);font-size:11px"> ${w.pos}</span>` : ''}</td>
      <td style="color:var(--text-dim);font-size:12px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escHtml(w.meaning)}">${escHtml(w.meaning)}</td>
      <td>${stageBadge}</td>
      <td class="interval-text">${w.dueDate || '今天'}</td>
    </tr>`;
  }).join('');

  return `
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px">
        <h2 style="margin:0">${escHtml(title)}</h2>
        <button class="btn btn-secondary" style="font-size:12px;padding:4px 10px"
          onclick="statsViewLevel='all';statsViewStage='all';document.getElementById('stats-word-panel').innerHTML=''">关闭</button>
      </div>
      ${filtered.length === 0
        ? '<p style="color:var(--text-dim);font-size:13px">没有符合条件的单词。</p>'
        : `<table class="word-table">
            <thead><tr>
              <th>德语单词</th><th>释义</th><th>状态</th><th>下次复习</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>`}
    </div>`;
}

// ── Import View ───────────────────────────────────────────────────────────────
function renderImport(container) {
  container.innerHTML = `
    <h1>导入单词</h1>
    <div class="import-area">
      <p>支持 CSV 格式，每行一个单词，列顺序：</p>
      <p><code>单词,冠词,词性,中文释义,例句,标签</code></p>
      <p>冠词可为 <code>der</code> / <code>die</code> / <code>das</code> 或留空，词性和例句可留空。</p>
      <p>示例：<code>lernen,,v.,学习,Ich lerne Deutsch.,动词</code></p>
      <p>第一行如果是标题行（包含"单词"或"word"）将自动跳过。</p>
    </div>
    <div class="file-input-wrap">
      <input type="file" id="csv-file" accept=".csv,.txt">
    </div>
    <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="importCSV()">导入 CSV</button>
      <button class="btn btn-secondary" onclick="downloadSample()">下载示例 CSV</button>
    </div>
    <div id="import-result" style="margin-top:18px"></div>

    <hr style="border:none;border-top:1px solid var(--border);margin:28px 0">

    <h2>数据备份与恢复</h2>
    <p style="color:var(--text-dim);font-size:13px;margin-bottom:16px">
      学习记录（单词进度、复习间隔、连续天数）存储在浏览器 localStorage 中。<br>
      换电脑、清除浏览器数据前请先导出备份，恢复时导入即可。
    </p>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="exportBackup()">导出备份 (.json)</button>
      <div>
        <input type="file" id="backup-file" accept=".json" style="display:none">
        <button class="btn btn-secondary" onclick="document.getElementById('backup-file').click()">导入备份 (.json)</button>
      </div>
    </div>
    <div id="backup-result" style="margin-top:14px"></div>`;

  document.getElementById('backup-file').addEventListener('change', e => {
    if (e.target.files[0]) importBackup(e.target.files[0]);
  });
}

function importCSV() {
  const file = document.getElementById('csv-file').files[0];
  if (!file) { toast('请先选择 CSV 文件'); return; }
  const reader = new FileReader();
  reader.onload = e => {
    const text = e.target.result;
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    let skip = 0;
    if (lines[0] && (lines[0].toLowerCase().includes('word') || lines[0].includes('单词'))) skip = 1;

    const existing = loadWords();
    const existingMap = new Map(existing.map(w => [w.word.toLowerCase(), w]));

    const toAdd = [], dupes = [];

    for (let i = skip; i < lines.length; i++) {
      // Proper CSV parse: handle quoted fields with commas inside
      const cols = parseCSVLine(lines[i]);
      const word = cols[0];
      if (!word) continue;
      if (existingMap.has(word.toLowerCase())) {
        dupes.push({ word, existing: existingMap.get(word.toLowerCase()) });
      } else {
        toAdd.push({
          word,
          article: cols[1] || '',
          pos:     cols[2] || '',
          meaning: cols[3] || '',
          example: cols[4] || '',
          tags:    cols[5] ? cols[5].split('|').map(t => t.trim()) : []
        });
      }
    }

    // Show preview
    const dupeRows = dupes.slice(0, 10).map(d => `
      <tr>
        <td><strong>${escHtml(d.word)}</strong></td>
        <td style="color:var(--text-dim);font-size:12px">${escHtml((d.existing.tags||[]).join(', '))}</td>
        <td style="color:var(--text-dim);font-size:12px">${
          {new:'新词',learning:'学习中',review:'复习',mature:'已掌握'}[cardStage(d.existing)]
        }</td>
      </tr>`).join('');

    const dupeNote = dupes.length > 10
      ? `<p style="color:var(--text-dim);font-size:12px;margin-top:6px">…以及另外 ${dupes.length - 10} 个重复词（不显示）</p>` : '';

    document.getElementById('import-result').innerHTML = `
      <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:18px;margin-top:4px">
        <div style="display:flex;gap:24px;margin-bottom:16px;flex-wrap:wrap">
          <div><span style="font-size:24px;font-weight:700;color:var(--green)">${toAdd.length}</span>
            <span style="font-size:13px;color:var(--text-dim);margin-left:6px">待导入（新词）</span></div>
          <div><span style="font-size:24px;font-weight:700;color:var(--yellow)">${dupes.length}</span>
            <span style="font-size:13px;color:var(--text-dim);margin-left:6px">重复跳过（已在单词本中）</span></div>
        </div>
        ${dupes.length > 0 ? `
          <details style="margin-bottom:14px">
            <summary style="cursor:pointer;font-size:13px;color:var(--text-dim);margin-bottom:8px">查看重复词 (${dupes.length}个)</summary>
            <table style="width:100%;font-size:12px;border-collapse:collapse">
              <thead><tr>
                <th style="text-align:left;color:var(--text-dim);padding:4px 8px">单词</th>
                <th style="text-align:left;color:var(--text-dim);padding:4px 8px">已有级别</th>
                <th style="text-align:left;color:var(--text-dim);padding:4px 8px">学习状态</th>
              </tr></thead>
              <tbody>${dupeRows}</tbody>
            </table>
            ${dupeNote}
          </details>` : ''}
        ${toAdd.length > 0 ? `
          <button class="btn btn-primary" onclick="confirmImport()" id="confirm-import-btn">
            确认导入 ${toAdd.length} 个新词
          </button>` : `<p style="color:var(--text-dim);font-size:13px">所有词汇均已存在，无需导入。</p>`}
      </div>`;

    // Store pending import on window
    window._pendingImport = toAdd;
  };
  reader.readAsText(file, 'UTF-8');
}

function confirmImport() {
  const toAdd = window._pendingImport;
  if (!toAdd || toAdd.length === 0) return;
  const existing = loadWords();
  // Double-check duplicates in case user imported twice
  const existingKeys = new Set(existing.map(w => w.word.toLowerCase()));
  const clean = toAdd.filter(w => !existingKeys.has(w.word.toLowerCase()));
  clean.forEach(w => existing.push(makeWord(w)));
  saveWords(existing);
  window._pendingImport = null;
  document.getElementById('import-result').innerHTML =
    `<p style="color:var(--green);font-size:14px">导入完成：已添加 ${clean.length} 个新词，单词本共 ${existing.length} 个单词。</p>`;
  toast(`已导入 ${clean.length} 个单词`);
}

function parseCSVLine(line) {
  const cols = [];
  let cur = '', inQuote = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      if (inQuote && line[i+1] === '"') { cur += '"'; i++; }
      else inQuote = !inQuote;
    } else if (ch === ',' && !inQuote) {
      cols.push(cur.trim()); cur = '';
    } else {
      cur += ch;
    }
  }
  cols.push(cur.trim());
  return cols;
}

  const csv = [
    'word,article,pos,meaning,example,tags',
    'lernen,,v.,学习,Ich lerne jeden Tag Deutsch.,动词|A1',

    'schön,,adj.,美丽的,Das Wetter ist heute schön.,形容词|A1',

  ].join('\n');

  a.href = URL.createObjectURL(blob);

  a.click();
}

// ── Modal (Add/Edit) ──────────────────────────────────────────────────────────
function openAdd() {
  editingId = null;
  document.getElementById('modal-title').textContent = '添加单词';
  document.getElementById('f-word').value = '';
  document.getElementById('f-article').value = '';
  setPosValue('');
  document.getElementById('f-meaning').value = '';
  document.getElementById('f-example').value = '';
  document.getElementById('f-tags').value = '';
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('f-word').focus(), 50);
}

function openEdit(id) {
  words = loadWords();
  const w = words.find(x => x.id === id);
  if (!w) return;
  editingId = id;
  document.getElementById('modal-title').textContent = '编辑单词';
  document.getElementById('f-word').value = w.word;
  document.getElementById('f-article').value = w.article || '';
  setPosValue(w.pos || '');
  document.getElementById('f-meaning').value = w.meaning;
  document.getElementById('f-example').value = w.example || '';
  document.getElementById('f-tags').value = (w.tags || []).join(', ');
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

function togglePos(el) {
  el.classList.toggle('active');
}

function getPosValue() {
  return [...document.querySelectorAll('#f-pos-toggles .pos-toggle.active')]
    .map(el => el.dataset.val).join('/');
}

function setPosValue(posStr) {
  const vals = posStr ? posStr.split('/').map(s => s.trim()) : [];
  document.querySelectorAll('#f-pos-toggles .pos-toggle').forEach(el => {
    el.classList.toggle('active', vals.includes(el.dataset.val));
  });
}

function saveWord() {
  const word = document.getElementById('f-word').value.trim();
  const meaning = document.getElementById('f-meaning').value.trim();
  if (!word || !meaning) { toast('单词和释义不能为空'); return; }

  words = loadWords();
  const tags = document.getElementById('f-tags').value
    .split(',').map(t => t.trim()).filter(Boolean);
  const posVal = getPosValue();

  if (editingId) {
    const idx = words.findIndex(w => w.id === editingId);
    if (idx !== -1) {
      words[idx].word = word;
      words[idx].article = document.getElementById('f-article').value;
      words[idx].pos = posVal;
      words[idx].meaning = meaning;
      words[idx].example = document.getElementById('f-example').value.trim();
      words[idx].tags = tags;
      persistWord(words[idx]);
    }
    toast('已更新');
  } else {
    const newWord = makeWord({
      word,
      article: document.getElementById('f-article').value,
      pos: posVal,
      meaning,
      example: document.getElementById('f-example').value.trim(),
      tags
    });
    words.push(newWord);
    persistWord(newWord);
    toast('已添加: ' + word);
  }
  closeModal();
  const activeNav = document.querySelector('nav button.active');
  if (activeNav) activeNav.click();
}

function deleteWord(id) {
  if (!confirm('确定删除这个单词？')) return;
  words = loadWords();
  words = words.filter(w => w.id !== id);
  _wordsCache = words;
  removeWordFromDB(id);
  toast('已删除');
  renderWords(document.getElementById('view'));
}

function makeWord(data) {
  return {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    word: data.word,
    article: data.article || '',
    pos: data.pos || '',
    meaning: data.meaning,
    example: data.example || '',
    tags: data.tags || [],
    interval: 0,
    repetitions: 0,
    easeFactor: 2.5,
    dueDate: null,
    lastReviewed: null
  };
}

// ── Backup / Restore ─────────────────────────────────────────────────────────
function exportBackup() {
  const backup = {
    version: 1,
    exportedAt: new Date().toISOString(),
    words: loadWords(),
    streaks: loadStreaks()
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `deutsch-karten-backup-${todayStr()}.json`;
  a.click();
  toast('备份已导出');
}

function importBackup(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const backup = JSON.parse(e.target.result);
      if (!backup.words || !Array.isArray(backup.words)) {
        document.getElementById('backup-result').innerHTML =
          '<p style="color:var(--red)">文件格式不正确，请使用本程序导出的备份文件。</p>';
        return;
      }
      const existing = loadWords();
      let merged = 0, kept = 0;
      const existingMap = new Map(existing.map(w => [w.id, w]));
      for (const w of backup.words) {
        if (existingMap.has(w.id)) {
          // Keep whichever has more repetitions (more progress)
          const cur = existingMap.get(w.id);
          if ((w.repetitions || 0) > (cur.repetitions || 0)) {
            existingMap.set(w.id, w);
            merged++;
          } else {
            kept++;
          }
        } else {
          existingMap.set(w.id, w);
          merged++;
        }
      }
      saveWords(Array.from(existingMap.values()));
      if (backup.streaks) saveStreaks(backup.streaks);
      document.getElementById('backup-result').innerHTML =
        `<p style="color:var(--green)">恢复成功：合并 ${merged} 条记录，保留本地 ${kept} 条。</p>`;
      toast('备份已恢复');
    } catch {
      document.getElementById('backup-result').innerHTML =
        '<p style="color:var(--red)">解析失败，请确认文件未损坏。</p>';
    }
  };
  reader.readAsText(file, 'UTF-8');
}


function articleHtml(article, cls = '') {
  if (!article) return '';
  const colorClass = article === 'der' ? 'art-der'
    : article === 'die' || article === 'die (Pl.)' ? 'art-die'
    : article === 'das' ? 'art-das' : 'art-pl';
  return `<span class="card-article ${colorClass} ${cls}">${article}</span>`;
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

// Close modal on overlay click
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});

// ── Init ──────────────────────────────────────────────────────────────────────
initWords().then(loaded => {
  words = loaded;
  showView('review');
}).catch(() => {
  _wordsCache = [];
  words = [];
  showView('review');
});
</script>
